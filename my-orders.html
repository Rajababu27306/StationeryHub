
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | StationeryHub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #e87532;
      --primary-dark: #c95b20;
      --cream: #fffaf3;
      --surface: #ffffff;
      --text: #30251f;
      --muted: #81766e;
      --border: #f0e5d9;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 17px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      color: var(--primary-dark);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    .header-links a {
      font-size: 14px;
      font-weight: 600;
    }

    .header-links a:hover {
      color: var(--primary-dark);
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border: none;
      background: var(--primary);
      color: white;
      padding: 11px 17px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .button.secondary {
      background: #fff1e5;
      color: #a64a19;
    }

    .button.secondary:hover {
      background: #ffe5cf;
    }

    main {
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
      padding: 38px 20px 50px;
      flex: 1;
    }

    .intro {
      margin-bottom: 27px;
    }

    .eyebrow {
      color: var(--primary-dark);
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .intro h1 {
      font-size: clamp(28px, 4vw, 38px);
      margin: 9px 0;
      letter-spacing: -1px;
    }

    .intro p {
      color: var(--muted);
      line-height: 1.7;
      margin: 0;
    }

    .orders-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .orders-heading h2 {
      font-size: 19px;
      margin: 0;
    }

    .order-count {
      color: #9a4c20;
      background: #fff0e2;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 23px;
      margin-bottom: 17px;
      box-shadow: 0 7px 24px rgba(89, 55, 25, 0.045);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      padding-bottom: 17px;
    }

    .order-top h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .order-id {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 30px;
      background: #fff0d4;
      color: #8a5700;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status.Confirmed {
      background: #e5f6e9;
      color: #21703b;
    }

    .status.Delivered {
      background: #dcfce7;
      color: #166534;
    }

    .status.Cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.Shipped {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .items {
      padding: 15px 0;
    }

    .items-heading {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      padding: 11px 0;
      border-bottom: 1px dashed #f0e5d9;
      font-size: 14px;
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .item-name {
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .item-price {
      white-space: nowrap;
    }

    .order-bottom {
      border-top: 1px solid var(--border);
      padding-top: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .total-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .total {
      font-size: 23px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .order-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .message {
      background: white;
      padding: 34px 20px;
      border-radius: 17px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 7px 24px rgba(89, 55, 25, 0.04);
    }

    .message h3 {
      margin: 0 0 10px;
    }

    .message p {
      color: var(--muted);
      line-height: 1.7;
      max-width: 500px;
      margin: 0 auto 20px;
    }

    .message.error {
      color: #b42318;
      line-height: 1.7;
    }

    .loading-dot {
      width: 25px;
      height: 25px;
      border: 3px solid #f4d7c1;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    footer {
      text-align: center;
      padding: 23px 16px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
      background: white;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px 20px;
      }

      .header-links {
        gap: 14px;
      }

      main {
        padding: 28px 15px 38px;
      }

      .order-card {
        padding: 17px;
      }

      .order-bottom {
        align-items: flex-start;
      }

      .order-actions {
        width: 100%;
      }

      .order-actions .button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="index.html">StationeryHub</a>

    <nav class="header-links">
      <a href="index.html">Home</a>
      <a href="customer-account.html">My Account</a>
      <button class="button secondary" id="logoutBtn" type="button">
        Logout
      </button>
    </nav>
  </header>

  <main>
    <section class="intro">
      <div class="eyebrow">Your shopping history</div>
      <h1>My Orders</h1>
      <p>Track your purchases, check order status and view your order details.</p>
    </section>

    <section>
      <div class="orders-heading">
        <h2>Your order history</h2>
        <span class="order-count" id="orderCount">Loading...</span>
      </div>

      <div id="ordersContainer">
        <div class="message">
          <div class="loading-dot"></div>
          <p>Loading your orders...</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2026 StationeryHub. Made for your everyday stationery needs.
  </footer>

  <script>
    const API_URL = "http://localhost:5000/api";
    const tokenKey = "stationeryHubCustomerToken";

    const container = document.getElementById("ordersContainer");
    const countLabel = document.getElementById("orderCount");
    const token = sessionStorage.getItem(tokenKey);

    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.removeItem(tokenKey);
      window.location.href = "customer-auth.html";
    });

    function showMessage(message, isError = false) {
      container.replaceChildren();

      const box = document.createElement("div");
      box.className = "message" + (isError ? " error" : "");
      box.textContent = message;

      container.appendChild(box);
      countLabel.textContent = "Unavailable";
    }

    function addText(parent, tag, text, className = "") {
      const element = document.createElement(tag);
      element.textContent = text == null ? "" : String(text);

      if (className) {
        element.className = className;
      }

      parent.appendChild(element);
      return element;
    }

    function formatDate(value) {
      if (!value) return "Date unavailable";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "Date unavailable";
      }

      return date.toLocaleString("en-IN", {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function formatMoney(value) {
      const amount = Number(value);

      return "₹" + (Number.isFinite(amount) ? amount : 0).toFixed(2);
    }

    function renderOrder(order) {
      const card = document.createElement("article");
      card.className = "order-card";

      const top = document.createElement("div");
      top.className = "order-top";

      const details = document.createElement("div");

      addText(details, "h3", "Order details");

      addText(
        details,
        "div",
        "Order ID: " + (order.orderId || "Unavailable"),
        "order-id"
      );

      addText(
        details,
        "p",
        "Placed on: " + formatDate(order.orderDate),
        "muted"
      );

      const currentStatus = String(order.status || "Pending");
      const allowedStatuses = [
        "Pending",
        "Confirmed",
        "Shipped",
        "Delivered",
        "Cancelled"
      ];

      const safeStatus = allowedStatuses.includes(currentStatus)
        ? currentStatus
        : "Pending";

      addText(top, "span", safeStatus, "status " + safeStatus);

      top.prepend(details);
      card.appendChild(top);

      const itemsBox = document.createElement("div");
      itemsBox.className = "items";

      addText(itemsBox, "div", "ITEMS ORDERED", "items-heading");

      const items = Array.isArray(order.items) ? order.items : [];

      if (items.length === 0) {
        addText(itemsBox, "p", "Item details are not available.", "muted");
      } else {
        items.forEach((item) => {
          const row = document.createElement("div");
          row.className = "item-row";

          const quantity = Number(item.quantity) || 0;
          const price = Number(item.price) || 0;

          addText(
            row,
            "span",
            (item.name || "Stationery item") + " × " + quantity,
            "item-name"
          );

          addText(
            row,
            "strong",
            formatMoney(price * quantity),
            "item-price"
          );

          itemsBox.appendChild(row);
        });
      }

      card.appendChild(itemsBox);

      const bottom = document.createElement("div");
      bottom.className = "order-bottom";

      const totalBox = document.createElement("div");
      addText(totalBox, "span", "TOTAL AMOUNT", "total-label");
      addText(totalBox, "span", formatMoney(order.totalAmount), "total");

      const actions = document.createElement("div");
      actions.className = "order-actions";

      const trackLink = document.createElement("a");
      trackLink.className = "button";
      trackLink.href = "track-order.html";
      trackLink.textContent = "Track Order";

      actions.appendChild(trackLink);

      bottom.append(totalBox, actions);

      const updated = addText(
        card,
        "p",
        "Last updated: " + formatDate(order.lastUpdated),
        "muted"
      );
      updated.style.margin = "14px 0 0";

      card.appendChild(bottom);

      return card;
    }

    async function loadOrders() {
      if (!token) {
        window.location.replace("customer-auth.html");
        return;
      }

      try {
        const response = await fetch(
          `${API_URL}/orders/my-orders`,
          {
            method: "GET",
            headers: {
              "Authorization": `Bearer ${token}`
            }
          }
        );

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("Server returned an invalid response. Please try again.");
        }

        if (response.status === 401 || response.status === 403) {
          sessionStorage.removeItem(tokenKey);
          window.location.replace("customer-auth.html");
          return;
        }

        if (!response.ok || !data.success) {
          throw new Error(data.message || "Unable to load your orders.");
        }

        const orders = Array.isArray(data.orders) ? data.orders : [];

        container.replaceChildren();
        countLabel.textContent =
          orders.length + (orders.length === 1 ? " order" : " orders");

        if (orders.length === 0) {
          const empty = document.createElement("div");
          empty.className = "message";

          addText(empty, "h3", "No orders yet");
          addText(
            empty,
            "p",
            "Your orders will appear here after you place your first purchase while logged in."
          );

          const shopLink = document.createElement("a");
          shopLink.href = "index.html";
          shopLink.className = "button";
          shopLink.textContent = "Start Shopping";

          empty.appendChild(shopLink);
          container.appendChild(empty);
          return;
        }

        orders.forEach((order) => {
          container.appendChild(renderOrder(order));
        });
      } catch (error) {
        console.error("My Orders error:", error);

        showMessage(
          error.message || "Could not connect to the server. Check that your backend is running.",
          true
        );
      }
    }

    loadOrders();
  </script>
</body>
</html>

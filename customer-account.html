<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | StationeryHub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 650px;
      margin: 40px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #0f172a12;
    }

    h1 {
      margin-top: 0;
    }

    .detail {
      padding: 15px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .label {
      color: #64748b;
      font-size: 14px;
    }

    .value {
      margin-top: 6px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button, .link {
      display: inline-block;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }

    .link:hover, button:hover {
      opacity: 0.88;
    }

    button.logout {
      background: #dc2626;
    }

    #message {
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      main {
        margin: 20px auto;
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>My Account</h1>

    <p id="message">Loading your account...</p>

    <section id="profile"></section>

    <div id="actions" class="actions" hidden>
      <a class="link" href="my-orders.html">My Orders</a>

      <a class="link" href="track-order.html">Track an Order</a>

      <a class="link" href="index.html">Continue Shopping</a>

      <button class="logout" id="logoutButton" type="button">
        Logout
      </button>
    </div>
  </main>

  <script>
    const API = "http://localhost:5000/api/customers";
    const token = sessionStorage.getItem(
      "stationeryHubCustomerToken"
    );

    const message = document.getElementById("message");
    const profile = document.getElementById("profile");
    const actions = document.getElementById("actions");

    function addDetail(label, value) {
      const row = document.createElement("div");
      row.className = "detail";

      const labelElement = document.createElement("div");
      labelElement.className = "label";
      labelElement.textContent = label;

      const valueElement = document.createElement("div");
      valueElement.className = "value";
      valueElement.textContent = value || "Not available";

      row.append(labelElement, valueElement);
      profile.appendChild(row);
    }

    async function loadAccount() {
      if (!token) {
        window.location.replace("customer-auth.html");
        return;
      }

      try {
        const response = await fetch(`${API}/me`, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (
          response.status === 401 ||
          response.status === 403
        ) {
          sessionStorage.removeItem(
            "stationeryHubCustomerToken"
          );
          window.location.replace("customer-auth.html");
          return;
        }

        if (!response.ok || !data.success || !data.customer) {
          throw new Error(
            data.message || "Unable to load account."
          );
        }

        addDetail("Name", data.customer.name);
        addDetail("Email", data.customer.email);

        addDetail(
          "Member Since",
          data.customer.joinedAt
            ? new Date(
                data.customer.joinedAt
              ).toLocaleDateString()
            : data.customer.createdAt
              ? new Date(
                  data.customer.createdAt
                ).toLocaleDateString()
              : "Not available"
        );

        message.textContent =
          "You are successfully logged in.";

        actions.hidden = false;

      } catch (error) {
        console.error("Account loading error:", error);

        message.textContent =
          "Cannot load your account. Please check that the backend is running and try again.";
      }
    }

    document
      .getElementById("logoutButton")
      .addEventListener("click", () => {
        sessionStorage.removeItem(
          "stationeryHubCustomerToken"
        );

        window.location.replace("customer-auth.html");
      });

    loadAccount();
  </script>
</body>
</html>

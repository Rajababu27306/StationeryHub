<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | StationeryHub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #172554;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h2 {
      margin: 0;
    }

    a {
      color: inherit;
    }

    .header-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .header-links a {
      text-decoration: none;
    }

    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 16px;
    }

    .intro {
      margin-bottom: 24px;
    }

    .intro p {
      color: #64748b;
    }

    .order-card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px #0f172a0c;
      border: 1px solid #e5e7eb;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 15px;
    }

    .order-id {
      font-size: 13px;
      color: #64748b;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 13px;
      font-weight: bold;
    }

    .status.Delivered {
      background: #dcfce7;
      color: #166534;
    }

    .status.Cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.Shipped {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .items {
      padding: 12px 0;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
    }

    .order-bottom {
      border-top: 1px solid #e5e7eb;
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      color: #172554;
    }

    .muted {
      color: #64748b;
      font-size: 14px;
    }

    .message {
      background: white;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #e5e7eb;
    }

    .button {
      display: inline-block;
      border: 0;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .button.secondary {
      background: #475569;
    }

    .error {
      color: #b91c1c;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
    }

    @media (max-width: 500px) {
      header {
        padding: 16px;
      }

      .order-card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h2>StationeryHub</h2>

    <nav class="header-links">
      <a href="index.html">Home</a>
      <a href="customer-account.html">Account</a>
      <button class="button secondary" id="logoutBtn">
        Logout
      </button>
    </nav>
  </header>

  <main>
    <section class="intro">
      <h1>My Orders</h1>
      <p>View your order history and current delivery status.</p>
    </section>

    <section id="ordersContainer">
      <div class="message">Loading your orders...</div>
    </section>
  </main>

  <footer>
    &copy; 2026 StationeryHub
  </footer>

  <script>
    const API_URL = "https://stationeryhub-1.onrender.com/api";
    const tokenKey = "stationeryHubCustomerToken";

    const container = document.getElementById("ordersContainer");
    const token = sessionStorage.getItem(tokenKey);

    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.removeItem(tokenKey);
      window.location.href = "customer-auth.html";
    });

    function showMessage(message, isError = false) {
      container.replaceChildren();

      const box = document.createElement("div");
      box.className = "message" + (isError ? " error" : "");
      box.textContent = message;

      container.appendChild(box);
    }

    function addText(parent, tag, text, className = "") {
      const element = document.createElement(tag);
      element.textContent = text;

      if (className) {
        element.className = className;
      }

      parent.appendChild(element);
      return element;
    }

    function formatDate(value) {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "Date unavailable";
      }

      return date.toLocaleString("en-IN", {
        dateStyle: "medium",
        timeStyle: "short"
      });
    }

    function renderOrder(order) {
      const card = document.createElement("article");
      card.className = "order-card";

      const top = document.createElement("div");
      top.className = "order-top";

      const details = document.createElement("div");

      addText(details, "h3", "Order details");
      addText(
        details,
        "div",
        "Order ID: " + order.orderId,
        "order-id"
      );
      addText(
        details,
        "p",
        "Placed: " + formatDate(order.orderDate),
        "muted"
      );

      const status = addText(
        top,
        "span",
        order.status || "Pending",
        "status " + (order.status || "Pending")
      );

      top.prepend(details);
      card.appendChild(top);

      const itemsBox = document.createElement("div");
      itemsBox.className = "items";

      (order.items || []).forEach((item) => {
        const row = document.createElement("div");
        row.className = "item-row";

        const name = document.createElement("span");
        name.textContent =
          `${item.name} × ${item.quantity}`;

        const price = document.createElement("strong");
        price.textContent = "₹" +
          (Number(item.price) * Number(item.quantity)).toFixed(2);

        row.append(name, price);
        itemsBox.appendChild(row);
      });

      card.appendChild(itemsBox);

      const bottom = document.createElement("div");
      bottom.className = "order-bottom";

      addText(
        bottom,
        "span",
        "Total: ₹" + Number(order.totalAmount).toFixed(2),
        "total"
      );

      addText(
        bottom,
        "span",
        "Last updated: " + formatDate(order.lastUpdated),
        "muted"
      );

      card.appendChild(bottom);
      return card;
    }

    async function loadOrders() {
      if (!token) {
        window.location.replace("customer-auth.html");
        return;
      }

      try {
        const response = await fetch(
          `${API_URL}/orders/my-orders`,
          {
            method: "GET",
            headers: {
              "Authorization": `Bearer ${token}`
            }
          }
        );

        const data = await response.json();

        if (response.status === 401 || response.status === 403) {
          sessionStorage.removeItem(tokenKey);
          window.location.replace("customer-auth.html");
          return;
        }

        if (!response.ok || !data.success) {
          throw new Error(data.message || "Unable to load orders.");
        }

        container.replaceChildren();

        if (!data.orders || data.orders.length === 0) {
          const empty = document.createElement("div");
          empty.className = "message";

          addText(empty, "h3", "No orders yet");
          addText(
            empty,
            "p",
            "Your new orders will appear here after you place them while logged in."
          );

          const shopLink = document.createElement("a");
          shopLink.href = "index.html";
          shopLink.className = "button";
          shopLink.textContent = "Start Shopping";

          empty.appendChild(shopLink);
          container.appendChild(empty);
          return;
        }

        data.orders.forEach((order) => {
          container.appendChild(renderOrder(order));
        });
      } catch (error) {
        console.error("My Orders error:", error);
        showMessage(
          error.message || "Could not connect to the server.",
          true
        );
      }
    }

    loadOrders();
  </script>
</body>
</html>

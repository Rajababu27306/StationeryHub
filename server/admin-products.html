
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StationeryHub | Product Management</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #172554;
      color: white;
      padding: 22px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 { margin: 0; font-size: 23px; }

    button, .nav-link {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      font-size: 14px;
    }

    .nav-link { background: white; color: #172554; }
    .logout { background: #dc2626; color: white; }

    main { max-width: 1150px; margin: 25px auto; padding: 0 16px; }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 22px;
      box-shadow: 0 3px 12px #0000000b;
    }

    h2 { margin-top: 0; font-size: 21px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    label { display: block; font-weight: bold; font-size: 14px; }

    input, textarea, select {
      width: 100%;
      padding: 11px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font: inherit;
    }

    textarea { resize: vertical; min-height: 75px; }
    .full { grid-column: 1 / -1; }

    .primary { background: #2563eb; color: white; }
    .secondary { background: #e2e8f0; color: #172033; }
    .edit { background: #dbeafe; color: #1d4ed8; }
    .delete { background: #fee2e2; color: #b91c1c; }

    .form-actions { display: flex; gap: 10px; margin-top: 17px; flex-wrap: wrap; }

    .notice { margin: 12px 0; font-size: 14px; }
    .error { color: #b91c1c; }
    .success { color: #15803d; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th, td {
      padding: 13px 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      font-size: 14px;
    }

    th { background: #f8fafc; }

    .stock-input { width: 90px; margin: 0 5px 0 0; }
    .actions { display: flex; gap: 7px; flex-wrap: wrap; }

    .count { color: #475569; margin-bottom: 14px; }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .panel { padding: 16px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>StationeryHub Admin</h1>
    <div>
      <a class="nav-link" href="admin.html">Orders Dashboard</a>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2 id="formTitle">Add New Product</h2>

      <form id="productForm">
        <div class="form-grid">
          <label>
            Product Name *
            <input id="name" required maxlength="120" />
          </label>

          <label>
            Category *
            <input id="category" required maxlength="80"
              placeholder="e.g. Pens, Notebooks" />
          </label>

          <label>
            Price (₹) *
            <input id="price" type="number" min="0" step="0.01" required />
          </label>

          <label>
            Available Stock *
            <input id="stock" type="number" min="0" step="1" required />
          </label>

          <label class="full">
            Image URL
            <input id="image" type="url" placeholder="https://example.com/image.jpg" />
          </label>

          <label class="full">
            Description
            <textarea id="description" maxlength="2000"></textarea>
          </label>
        </div>

        <div class="form-actions">
          <button class="primary" id="saveBtn" type="submit">Add Product</button>
          <button class="secondary" id="cancelBtn" type="button" hidden>
            Cancel Edit
          </button>
        </div>

        <p id="formMessage" class="notice" role="status"></p>
      </form>
    </section>

    <section class="panel">
      <h2>Manage Products</h2>
      <p id="productCount" class="count">Loading products...</p>

      <label>
        Search products
        <input id="search" placeholder="Search by name or category..." />
      </label>

      <p id="listMessage" class="notice" role="status"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const API = "http://localhost:5000/api/products";
    const tokenKey = "stationeryHubAdminToken";

    let products = [];
    let editingId = null;

    const $ = (id) => document.getElementById(id);

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function authHeaders(json = false) {
      const headers = {
        Authorization: "Bearer " + sessionStorage.getItem(tokenKey)
      };

      if (json) headers["Content-Type"] = "application/json";
      return headers;
    }

    async function request(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));

      if (response.status === 401 || response.status === 403) {
        sessionStorage.removeItem(tokenKey);
        alert("Admin session expire ho gaya. Dobara login karein.");
        window.location.href = "../admin-login.html";
        throw new Error("Admin login required.");
      }

      if (!response.ok || data.success === false) {
        throw new Error(data.message || "Request complete nahi hui.");
      }

      return data;
    }

    function showMessage(elementId, message, isError = false) {
      const element = $(elementId);
      element.textContent = message;
      element.className = "notice " + (isError ? "error" : "success");
    }

    async function loadProducts() {
      $("listMessage").textContent = "";
      $("productRows").innerHTML = "";

      try {
        const data = await request(API);
        products = data.products || [];
        renderProducts();
      } catch (error) {
        showMessage("listMessage", error.message, true);
        $("productCount").textContent = "Products load nahi hue.";
      }
    }

    function renderProducts() {
      const query = $("search").value.trim().toLowerCase();

      const filtered = products.filter((product) =>
        [product.name, product.category]
          .some(value => String(value || "").toLowerCase().includes(query))
      );

      $("productCount").textContent =
        `${filtered.length} product(s) shown • ${products.length} total`;

      if (!filtered.length) {
        $("productRows").innerHTML =
          '<tr><td colspan="5">Koi product nahi mila.</td></tr>';
        return;
      }

      $("productRows").innerHTML = filtered.map(product => `
        <tr>
          <td>
            <strong>${escapeHTML(product.name)}</strong>
            <br>
            <small>ID: ${escapeHTML(product._id)}</small>
          </td>
          <td>${escapeHTML(product.category)}</td>
          <td>₹${Number(product.price).toFixed(2)}</td>
          <td>
            <input class="stock-input" type="number" min="0" step="1"
              value="${Number(product.stock)}"
              id="stock-${escapeHTML(product._id)}"
              aria-label="Stock for ${escapeHTML(product.name)}">
            <button class="edit"
              data-action="stock"
              data-id="${escapeHTML(product._id)}">Save</button>
          </td>
          <td>
            <div class="actions">
              <button class="edit" data-action="edit"
                data-id="${escapeHTML(product._id)}">Edit</button>
              <button class="delete" data-action="delete"
                data-id="${escapeHTML(product._id)}">Delete</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function resetForm() {
      editingId = null;
      $("productForm").reset();
      $("formTitle").textContent = "Add New Product";
      $("saveBtn").textContent = "Add Product";
      $("cancelBtn").hidden = true;
      $("formMessage").textContent = "";
    }

    $("productForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = $("name").value.trim();
      const category = $("category").value.trim();
      const price = Number($("price").value);
      const stock = Number($("stock").value);

      if (!name || !category || !Number.isFinite(price) || price < 0 ||
          !Number.isInteger(stock) || stock < 0) {
        showMessage("formMessage", "Name, category, price aur stock check karein.", true);
        return;
      }

      const payload = {
        name,
        category,
        price,
        stock,
        image: $("image").value.trim(),
        description: $("description").value.trim()
      };

      $("saveBtn").disabled = true;

      try {
        const url = editingId ? `${API}/${editingId}` : API;
        const method = editingId ? "PUT" : "POST";

        const data = await request(url, {
          method,
          headers: authHeaders(true),
          body: JSON.stringify(payload)
        });

        showMessage("formMessage", data.message || "Product save ho gaya.");
        resetForm();
        await loadProducts();
      } catch (error) {
        showMessage("formMessage", error.message, true);
      } finally {
        $("saveBtn").disabled = false;
      }
    });

    $("productRows").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const id = button.dataset.id;
      const action = button.dataset.action;
      const product = products.find(item => item._id === id);

      if (!product) return;

      if (action === "edit") {
        editingId = id;
        $("name").value = product.name || "";
        $("category").value = product.category || "";
        $("price").value = product.price;
        $("stock").value = product.stock;
        $("image").value = product.image || "";
        $("description").value = product.description || "";

        $("formTitle").textContent = "Edit Product";
        $("saveBtn").textContent = "Save Changes";
        $("cancelBtn").hidden = false;
        $("formMessage").textContent = "";

        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      if (action === "stock") {
        const input = $("stock-" + id);
        const stock = Number(input.value);

        if (!Number.isInteger(stock) || stock < 0) {
          showMessage("listMessage", "Stock valid whole number hona chahiye.", true);
          return;
        }

        button.disabled = true;

        try {
          const data = await request(`${API}/${id}/stock`, {
            method: "PATCH",
            headers: authHeaders(true),
            body: JSON.stringify({ stock })
          });

          showMessage("listMessage", data.message || "Stock update ho gaya.");
          await loadProducts();
        } catch (error) {
          showMessage("listMessage", error.message, true);
        } finally {
          button.disabled = false;
        }

        return;
      }

      if (action === "delete") {
        if (!confirm(`"${product.name}" ko delete karna hai?`)) return;

        button.disabled = true;

        try {
          const data = await request(`${API}/${id}`, {
            method: "DELETE",
            headers: authHeaders()
          });

          if (editingId === id) resetForm();

          showMessage("listMessage", data.message || "Product delete ho gaya.");
          await loadProducts();
        } catch (error) {
          showMessage("listMessage", error.message, true);
        } finally {
          button.disabled = false;
        }
      }
    });

    $("cancelBtn").addEventListener("click", resetForm);
    $("search").addEventListener("input", renderProducts);

    $("logoutBtn").addEventListener("click", () => {
      sessionStorage.removeItem(tokenKey);
      window.location.href = "../admin-login.html";
    });

    if (!sessionStorage.getItem(tokenKey)) {
      window.location.href = "../admin-login.html";
    } else {
      loadProducts();
    }
  </script>
</body>
</html>

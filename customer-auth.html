
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Account | StationeryHub</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eff6ff, #f8fafc);
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 28px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 40px #0f172a15;
    }

    h1 { margin: 0 0 8px; }
    .subtitle { color: #64748b; line-height: 1.5; }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 24px 0;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: 1px solid #dbe3ef;
      border-radius: 8px;
      background: #f8fafc;
      cursor: pointer;
    }

    .tabs button.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #bfdbfe;
      border-color: #2563eb;
    }

    .submit {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }

    #message {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error { color: #b91c1c; }
    .success { color: #15803d; }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #2563eb;
      text-decoration: none;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
  <main class="card">
    <h1>StationeryHub</h1>
    <p class="subtitle">Create your account or sign in to continue.</p>

    <div class="tabs">
      <button type="button" id="loginTab" class="active">Login</button>
      <button type="button" id="signupTab">Sign Up</button>
    </div>

    <form id="authForm">
      <div id="nameField" class="hidden">
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name"
               minlength="2" maxlength="80">
      </div>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
             autocomplete="email" maxlength="254" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password"
             minlength="8" maxlength="72" required>

      <button class="submit" id="submitButton" type="submit">
        Login
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="back" href="index.html">← Back to Home</a>
  </main>

  <script>
    const API = "http://localhost:5000/api/customers";

    const authForm = document.getElementById("authForm");
    const nameField = document.getElementById("nameField");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    let mode = "login";

    function showMessage(text, type = "") {
      message.textContent = text;
      message.className = type;
    }

    function setMode(nextMode) {
      mode = nextMode;
      const signup = mode === "signup";

      nameField.classList.toggle("hidden", !signup);
      nameInput.required = signup;
      passwordInput.autocomplete = signup
        ? "new-password"
        : "current-password";

      submitButton.textContent = signup ? "Create Account" : "Login";
      loginTab.classList.toggle("active", !signup);
      signupTab.classList.toggle("active", signup);

      showMessage("");
    }

    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("");

      submitButton.disabled = true;
      submitButton.textContent = "Please wait...";

      try {
        const payload = {
          email: emailInput.value.trim(),
          password: passwordInput.value
        };

        if (mode === "signup") {
          payload.name = nameInput.value.trim();
        }

        const response = await fetch(
          `${API}/${mode}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || "Request failed.");
        }

        if (mode === "signup") {
          showMessage(
            "Account created! Please log in with your new account.",
            "success"
          );

          passwordInput.value = "";
          setMode("login");
          return;
        }

        // Keep customer token separate from the admin token.
        sessionStorage.setItem(
          "stationeryHubCustomerToken",
          data.token
        );

        window.location.href = "customer-account.html";
      } catch (error) {
        showMessage(
          error.message === "Failed to fetch"
            ? "Cannot connect to the server. Check that the backend is running."
            : error.message,
          "error"
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent =
          mode === "signup" ? "Create Account" : "Login";
      }
    });
  </script>
</body>
</html>
